name: Build PlumDownloader

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: PlumDownloader-windows
          - os: macos-latest
            artifact: PlumDownloader-macos
          - os: ubuntu-latest
            artifact: PlumDownloader-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: pyinstaller PlumDownloader.spec

      - name: Zip .app bundle (macOS only)
        if: matrix.os == 'macos-latest'
        run: cd dist && zip -r PlumDownloader-macos.zip PlumDownloader.app

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/PlumDownloader.exe

      - name: Upload artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/PlumDownloader-macos.zip

      - name: Upload artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/PlumDownloader

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PlumDownloader ${{ github.ref_name }}
          body: |
            ## PlumDownloader ${{ github.ref_name }}

            A companion desktop app!

            ### Downloads
            | Platform | File |
            |---|---|
            | Windows | `PlumDownloader.exe` |
            | macOS | `PlumDownloader-macos.zip` - unzip and open `PlumDownloader.app` |
            | Linux | `PlumDownloader` - make executable with `chmod +x PlumDownloader` |
          files: artifacts/**/*
          draft: false
          prerelease: false